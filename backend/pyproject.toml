[project]
name = "pathboard-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1"]
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "httpx2>=2.16.2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
